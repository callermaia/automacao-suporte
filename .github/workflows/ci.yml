name: Integracao Continua (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-e-teste:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências e Linter
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verificar sintaxe do Python (Linting)
      run: |
        # Verifica erros de sintaxe ou variáveis não utilizadas
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Alerta se houver desvios de estilo PEP8 sem quebrar a esteira
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Testar Build da Imagem Docker
      run: |
        docker build -t monitor-disco:ci .
